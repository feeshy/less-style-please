# This workflow builds and deploys a Jekyll site to GitHub Pages.
# It always builds from the `master` branch, regardless of which branch was pushed.
# Triggers: pushes to `master` or `full`.

name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [build_web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch (always)
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # v1.313.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5