name: Sync lite branch

on:
  push:
    branches:
      - master   # 当 master 分支有推送时运行

permissions:
  contents: write   # 允许推送代码到 lite 分支

jobs:
  sync-lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史，以便切换分支

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Sync to lite branch (one-way overwrite) and remove excluded items
        run: |
          # 强制将 lite 分支指向 master 的当前 commit（单向同步）
          git checkout -b lite origin/lite 2>/dev/null || git checkout -b lite
          git reset --hard master

          # 先读取排除列表到数组（避免文件自删除导致读取中断）
          excluded_items=()
          if [ -f .lite-excluded ]; then
            echo "Reading .lite-excluded..."
            mapfile -t lines < .lite-excluded
            for line in "${lines[@]}"; do
              # 跳过空行和注释
              if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
                continue
              fi
              excluded_items+=("$line")
            done
            echo "Found ${#excluded_items[@]} items to exclude."
          else
            echo "Warning: .lite-excluded not found, skip deletion and import cleaning."
          fi

          # 删除文件和目录
          if [ ${#excluded_items[@]} -gt 0 ]; then
            echo "Deleting excluded files/directories..."
            for item in "${excluded_items[@]}"; do
              rm -rf "$item"
              echo "  Removed: $item"
            done

            # 清理 SCSS 中 @import 被删除文件的语句
            echo "Cleaning @import statements for removed .scss files..."
            for item in "${excluded_items[@]}"; do
              # 只处理 .scss 文件
              if [[ "$item" == *.scss ]]; then
                # 提取文件名（不含路径和扩展名）
                base=$(basename "$item" .scss)
                # 在所有 .scss 文件中删除包含 @import 该文件的行
                # 匹配模式：@import "base" 或 @import 'base'
                find . -name "*.scss" -type f -exec sed -i "/@import\s+[\"']${base}[\"']/d" {} \;
                echo "    Removed imports for: $base"
              fi
            done
          fi

          # 提交更改（如果没有更改则跳过）
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit in lite branch."
          else
            git commit -m "One-way sync from master and remove lite-excluded items"
          fi

          # 强制推送 lite 分支（确保远程 lite 分支与本地一致）
          git push origin lite --force-with-lease