---
sitemap: false
noindex: true
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

<head>
  {% include head.html %}
</head>

<body>
  {% include nav.html %}
  <main class="page-content" aria-label="Content">
    <h1 style="display: inline-flex; flex-direction: row; align-items: center;">
      {%-include logo.html-%}
      <span>{{ page.title | default: 'redirecting...' }}</span>
    </h1>

    <blockquote id="redirect-box">
      <a href="{{ page.redirect.to | relative_url}}" id="url">点击跳转<br>Click to continue</a>
    </blockquote>

    {{ content }}
  </main>

  <script>
    window.onload = function () {
      var box = document.getElementById('redirect-box');
      var targetUrl = document.getElementById('url').href;
      if (targetUrl) {
        box.innerHTML = '跳转中...<br>Redirecting...';
        window.location = targetUrl;
      }
    }
  </script>
</body>

</html>
